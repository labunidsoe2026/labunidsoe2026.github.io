<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Galeri | Laboratorium Terpadu UNIDSOE</title>
<style>
:root{--p:#0b5d4b;--d:#063c31;--bg:#f4f7f6;--mut:#6b7280;--danger:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#1f2937}
header{background:linear-gradient(135deg,var(--d),var(--p));color:white;padding:20px 24px}
.wrap{width:min(1100px,calc(100% - 28px));margin:auto}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:18px}
h1{margin:0;font-size:23px} header p{margin:4px 0 0;font-size:13px;color:#d7ebe5}
main{padding:34px 0 60px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.06);margin-bottom:22px}
.login{max-width:500px;margin:80px auto}
h2{margin:0 0 18px;color:var(--d)}
.field{display:grid;gap:7px;margin-bottom:14px}
label{font-weight:700;font-size:13px}
input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}
textarea{min-height:90px}
button{border:0;border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.primary{background:var(--p);color:#fff}
.secondary{background:#eef2f1;color:#374151}
.danger{background:#fee4e2;color:var(--danger)}
.light{background:white;color:var(--d)}
.hidden{display:none!important}
.status{display:none;margin-top:14px;padding:11px 12px;border-radius:10px;font-size:13px}
.status.show{display:block}
.status.ok{background:#ecfdf3;color:#027a48}
.status.err{background:#fef3f2;color:#b42318}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.full{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}
.item{border:1px solid #e5e7eb;border-radius:15px;overflow:hidden;background:white}
.item img{width:100%;height:190px;object-fit:cover;background:#e5e7eb}
.item-body{padding:15px}
.item h3{margin:7px 0;color:var(--d)}
.badge{display:inline-block;background:#eaf5f2;color:var(--p);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700}
.small,.desc{font-size:13px;color:var(--mut)}
.item-actions{display:flex;gap:8px;margin-top:13px}
.item-actions button{flex:1}
dialog{border:0;border-radius:16px;width:min(540px,calc(100% - 30px));padding:0;box-shadow:0 20px 70px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dialog-body{padding:22px}
@media(max-width:820px){.gallery{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){header .wrap{flex-direction:column;align-items:flex-start}.grid,.gallery{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>

<header>
<div class="wrap">
  <div>
    <h1>Admin Laboratorium Terpadu</h1>
    <p>Universitas Dr. Soekardjo Banyuwangi</p>
  </div>
  <button id="logoutBtn" class="light hidden">Logout</button>
</div>
</header>

<main class="wrap">
<section id="loginBox" class="card login">
  <h2>Login Admin</h2>
  <div class="field">
    <label>Email</label>
    <input id="email" type="email" autocomplete="username">
  </div>
  <div class="field">
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">
  </div>
  <button id="loginBtn" type="button" class="primary">Login</button>
  <div id="loginStatus" class="status"></div>
</section>

<section id="adminBox" class="hidden">
  <div class="card">
    <h2>Upload Foto Galeri</h2>
    <div class="grid">
      <div class="field">
        <label>Judul</label>
        <input id="judul" placeholder="Contoh: Praktikum RJP">
      </div>
      <div class="field">
        <label>Kategori</label>
        <input id="kategori" placeholder="Contoh: Kegiatan Praktikum">
      </div>
      <div class="field full">
        <label>Deskripsi</label>
        <textarea id="deskripsi"></textarea>
      </div>
      <div class="field full">
        <label>Pilih Foto</label>
        <input id="foto" type="file" accept="image/*">
        <div class="small">Maksimal 10 MB per foto.</div>
      </div>
    </div>
    <div class="actions">
      <button id="uploadBtn" type="button" class="primary">Upload & Simpan</button>
      <button id="resetBtn" type="button" class="secondary">Kosongkan</button>
    </div>
    <div id="uploadStatus" class="status"></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div>
        <h2 style="margin-bottom:4px">Kelola Galeri</h2>
        <div class="small">Edit judul, kategori, deskripsi, atau hapus foto.</div>
      </div>
      <button id="refreshBtn" type="button" class="secondary">Refresh</button>
    </div>
    <div id="gallery" class="gallery"></div>
    <div id="empty" class="small">Belum ada data galeri.</div>
  </div>
</section>
</main>

<dialog id="editDialog">
<div class="dialog-body">
  <h2>Edit Galeri</h2>
  <input id="editId" type="hidden">
  <div class="grid">
    <div class="field"><label>Judul</label><input id="editJudul"></div>
    <div class="field"><label>Kategori</label><input id="editKategori"></div>
    <div class="field full"><label>Deskripsi</label><textarea id="editDeskripsi"></textarea></div>
  </div>
  <div class="actions">
    <button id="saveEditBtn" type="button" class="primary">Simpan</button>
    <button id="cancelEditBtn" type="button" class="secondary">Batal</button>
  </div>
  <div id="editStatus" class="status"></div>
</div>
</dialog>

<script>
const BASE_URL = 'https://plottbyxuuqzlppytkqj.supabase.co';
const API_KEY = 'sb_publishable_rI0z0kyaLhMP3x4_lhL79w_M5oHEGWB';
const ADMIN_UID = '5a12f804-2471-47d5-8605-ae8cd7c99b10';

let accessToken = sessionStorage.getItem("lab_access_token") || "";
let currentUserId = sessionStorage.getItem("lab_user_id") || "";

const $ = id => document.getElementById(id);

function setStatus(id,msg,type=""){
  const el=$(id);
  el.textContent=msg;
  el.className="status show "+type;
}
function clearStatus(id){
  const el=$(id);
  el.textContent="";
  el.className="status";
}
function showLogin(){
  $("loginBox").classList.remove("hidden");
  $("adminBox").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
}
function showAdmin(){
  $("loginBox").classList.add("hidden");
  $("adminBox").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
}

async function apiFetch(path, options={}, useAuth=true){
  const headers = Object.assign({
    "apikey": API_KEY
  }, options.headers || {});

  if(useAuth && accessToken){
    headers["Authorization"]="Bearer "+accessToken;
  }

  return fetch(BASE_URL+path, Object.assign({}, options, {headers}));
}

async function login(){
  clearStatus("loginStatus");
  const email=$("email").value.trim();
  const password=$("password").value;

  if(!email || !password){
    setStatus("loginStatus","Email dan password wajib diisi.","err");
    return;
  }

  $("loginBtn").disabled=true;
  $("loginBtn").textContent="Memproses...";

  try {
    const res=await fetch(BASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{
        "apikey":API_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({email,password})
    });

    const data=await res.json();

    if(!res.ok){
      throw new Error(data.error_description || data.msg || data.message || "Login gagal");
    }

    if(!data.user || data.user.id !== ADMIN_UID){
      throw new Error("Akun ini tidak memiliki hak admin.");
    }

    accessToken=data.access_token;
    currentUserId=data.user.id;
    sessionStorage.setItem("lab_access_token",accessToken);
    sessionStorage.setItem("lab_user_id",currentUserId);

    showAdmin();
    await loadGallery();
  } catch(err) {
    setStatus("loginStatus","Login gagal: "+err.message,"err");
  } finally {
    $("loginBtn").disabled=false;
    $("loginBtn").textContent="Login";
  }
}

$("loginBtn").addEventListener("click",login);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login();});

$("logoutBtn").addEventListener("click",()=>{
  accessToken="";
  currentUserId="";
  sessionStorage.removeItem("lab_access_token");
  sessionStorage.removeItem("lab_user_id");
  showLogin();
});

function safeName(name){
  const parts=name.split(".");
  const ext=parts.length>1 ? "."+parts.pop().toLowerCase() : "";
  const base=parts.join(".").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,45) || "foto";
  return Date.now()+"-"+base+ext;
}

$("resetBtn").addEventListener("click",()=>{
  $("judul").value="";
  $("kategori").value="";
  $("deskripsi").value="";
  $("foto").value="";
  clearStatus("uploadStatus");
});

$("uploadBtn").addEventListener("click",async()=>{
  clearStatus("uploadStatus");
  const judul=$("judul").value.trim();
  const kategori=$("kategori").value.trim();
  const deskripsi=$("deskripsi").value.trim();
  const file=$("foto").files[0];

  if(!judul || !file){
    setStatus("uploadStatus","Judul dan foto wajib diisi.","err");
    return;
  }
  if(file.size > 10*1024*1024){
    setStatus("uploadStatus","Ukuran foto melebihi 10 MB.","err");
    return;
  }

  $("uploadBtn").disabled=true;
  $("uploadBtn").textContent="Mengupload...";

  const fileName=safeName(file.name);

  try {
    const uploadRes=await apiFetch("/storage/v1/object/galery/"+encodeURIComponent(fileName),{
      method:"POST",
      headers:{
        "Content-Type":file.type || "application/octet-stream",
        "x-upsert":"false"
      },
      body:file
    });

    if(!uploadRes.ok){
      const t=await uploadRes.text();
      throw new Error("Upload gagal: "+t);
    }

    const publicUrl=BASE_URL+"/storage/v1/object/public/galery/"+encodeURIComponent(fileName);

    const insertRes=await apiFetch("/rest/v1/galery",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        judul,
        kategori,
        deskripsi,
        url_foto:publicUrl,
        nama_file:fileName
      })
    });

    if(!insertRes.ok){
      const t=await insertRes.text();
      await apiFetch("/storage/v1/object/galery/"+encodeURIComponent(fileName),{method:"DELETE"});
      throw new Error("Data gagal disimpan: "+t);
    }

    $("judul").value="";
    $("kategori").value="";
    $("deskripsi").value="";
    $("foto").value="";
    setStatus("uploadStatus","Foto berhasil diupload dan disimpan.","ok");
    await loadGallery();

  } catch(err) {
    setStatus("uploadStatus",err.message,"err");
  } finally {
    $("uploadBtn").disabled=false;
    $("uploadBtn").textContent="Upload & Simpan";
  }
});

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadGallery(){
  $("gallery").innerHTML="";
  $("empty").textContent="Memuat data...";

  try {
    const res=await apiFetch("/rest/v1/galery?select=*&order=created_at.desc",{
      method:"GET"
    });

    if(!res.ok){
      throw new Error(await res.text());
    }

    const data=await res.json();

    if(!data.length){
      $("empty").textContent="Belum ada data galeri.";
      $("empty").classList.remove("hidden");
      return;
    }

    $("empty").classList.add("hidden");

    data.forEach(item=>{
      const card=document.createElement("article");
      card.className="item";
      card.innerHTML=`
        <img src="${esc(item.url_foto||"")}" alt="${esc(item.judul||"Foto")}">
        <div class="item-body">
          ${item.kategori ? `<span class="badge">${esc(item.kategori)}</span>` : ""}
          <h3>${esc(item.judul||"Tanpa judul")}</h3>
          <div class="desc">${esc(item.deskripsi||"")}</div>
          <div class="item-actions">
            <button type="button" class="secondary edit">Edit</button>
            <button type="button" class="danger del">Hapus</button>
          </div>
        </div>
      `;
      card.querySelector(".edit").addEventListener("click",()=>openEdit(item));
      card.querySelector(".del").addEventListener("click",()=>deleteItem(item));
      $("gallery").appendChild(card);
    });
  } catch(err) {
    $("empty").classList.remove("hidden");
    $("empty").textContent="Gagal membaca galeri: "+err.message;
  }
}

$("refreshBtn").addEventListener("click",loadGallery);

function openEdit(item){
  $("editId").value=item.id;
  $("editJudul").value=item.judul||"";
  $("editKategori").value=item.kategori||"";
  $("editDeskripsi").value=item.deskripsi||"";
  clearStatus("editStatus");
  $("editDialog").showModal();
}

$("cancelEditBtn").addEventListener("click",()=>$("editDialog").close());

$("saveEditBtn").addEventListener("click",async()=>{
  clearStatus("editStatus");
  const id=$("editId").value;
  const judul=$("editJudul").value.trim();
  const kategori=$("editKategori").value.trim();
  const deskripsi=$("editDeskripsi").value.trim();

  if(!judul){
    setStatus("editStatus","Judul tidak boleh kosong.","err");
    return;
  }

  try {
    const res=await apiFetch("/rest/v1/galery?id=eq."+encodeURIComponent(id),{
      method:"PATCH",
      headers:{
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({judul,kategori,deskripsi})
    });

    if(!res.ok) throw new Error(await res.text());

    setStatus("editStatus","Perubahan berhasil disimpan.","ok");
    await loadGallery();
    setTimeout(()=>$("editDialog").close(),500);
  } catch(err) {
    setStatus("editStatus","Gagal menyimpan: "+err.message,"err");
  }
});

async function deleteItem(item){
  if(!confirm('Hapus "'+(item.judul||"foto ini")+'"?')) return;

  try {
    if(item.nama_file){
      const s=await apiFetch("/storage/v1/object/galery/"+encodeURIComponent(item.nama_file),{
        method:"DELETE"
      });
      if(!s.ok) throw new Error("File gagal dihapus: "+await s.text());
    }

    const d=await apiFetch("/rest/v1/galery?id=eq."+encodeURIComponent(item.id),{
      method:"DELETE",
      headers:{"Prefer":"return=minimal"}
    });
    if(!d.ok) throw new Error("Data gagal dihapus: "+await d.text());

    await loadGallery();
  } catch(err) {
    alert(err.message);
  }
}

if(accessToken && currentUserId===ADMIN_UID){
  showAdmin();
  loadGallery();
} else {
  showLogin();
}
</script>
</body>
</html>
