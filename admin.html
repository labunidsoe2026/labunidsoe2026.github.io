<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Galeri Laboratorium Terpadu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#0b5d4b;--d:#063c31;--bg:#f4f7f6;--mut:#6b7280;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#1f2937}header{background:linear-gradient(135deg,var(--d),var(--p));color:#fff;padding:22px}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:18px}h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:#d7ebe5;font-size:13px}main{padding:32px 0 60px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:22px;box-shadow:0 8px 28px rgba(0,0,0,.05);margin-bottom:22px}.login{max-width:470px;margin:60px auto}h2{margin:0 0 18px;color:var(--d)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.field{display:grid;gap:7px}label{font-size:13px;font-weight:700}input,textarea{width:100%;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}textarea{min-height:90px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.light{background:#fff;color:var(--d)}.secondary{background:#eef2f1}.danger{background:#fee4e2;color:var(--danger)}.hidden{display:none!important}.status{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px}.status.show{display:block}.ok{background:#ecfdf3;color:#027a48}.err{background:#fef3f2;color:#b42318}.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center}.list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:18px}.item{background:#fff;border:1px solid #e5e7eb;border-radius:15px;overflow:hidden}.item img{width:100%;height:190px;object-fit:cover;background:#e5e7eb}.body{padding:15px}.body h3{margin:8px 0;color:var(--d)}.badge{display:inline-block;background:#eaf5f2;color:var(--p);border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700}.desc,.small{font-size:13px;color:var(--mut)}.item-actions{display:flex;gap:8px;margin-top:13px}.item-actions button{flex:1}dialog{border:0;border-radius:16px;width:min(540px,calc(100% - 30px));padding:0;box-shadow:0 20px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.55)}.dialog{padding:22px}@media(max-width:820px){.list{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header .wrap{align-items:flex-start;flex-direction:column}.grid,.list{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="wrap"><div><h1>Admin Laboratorium Terpadu</h1><p>Universitas Dr. Soekardjo Banyuwangi</p></div><button id="logout" class="light hidden">Logout</button></div></header>
<main class="wrap">
<section id="loginBox" class="card login"><h2>Login Admin</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field" style="margin-top:14px"><label>Password</label><input id="password" type="password"></div><div class="actions"><button id="login" class="primary">Login</button></div><div id="loginStatus" class="status"></div></section>
<section id="adminBox" class="hidden">
<div class="card"><h2>Upload Foto Galeri</h2><div class="grid"><div class="field"><label>Judul</label><input id="judul" placeholder="Contoh: Praktikum RJP"></div><div class="field"><label>Kategori</label><input id="kategori" placeholder="Contoh: Kegiatan Praktikum"></div><div class="field full"><label>Deskripsi</label><textarea id="deskripsi"></textarea></div><div class="field full"><label>Pilih Foto</label><input id="foto" type="file" accept="image/*"><div class="small">Maksimal 10 MB.</div></div></div><div class="actions"><button id="upload" class="primary">Upload & Simpan</button><button id="reset" class="secondary">Kosongkan</button></div><div id="uploadStatus" class="status"></div></div>
<div class="card"><div class="toolbar"><div><h2 style="margin-bottom:4px">Kelola Galeri</h2><div class="small">Edit judul, kategori, deskripsi, atau hapus.</div></div><button id="refresh" class="secondary">Refresh</button></div><div id="gallery" class="list"></div><div id="empty" class="small">Belum ada data galeri.</div></div>
</section></main>
<dialog id="editDialog"><div class="dialog"><h2>Edit Galeri</h2><input id="editId" type="hidden"><div class="grid"><div class="field"><label>Judul</label><input id="editJudul"></div><div class="field"><label>Kategori</label><input id="editKategori"></div><div class="field full"><label>Deskripsi</label><textarea id="editDeskripsi"></textarea></div></div><div class="actions"><button id="saveEdit" class="primary">Simpan</button><button id="cancelEdit" class="secondary">Batal</button></div><div id="editStatus" class="status"></div></div></dialog>
<script>
const URL='https://plottbyxuuqzlppytkqj.supabase.co';
const KEY='sb_publishable_rI0z0kyaLhMP3x4_lhL79w_M5oHEGWB';
const ADMIN='5a12f804-2471-47d5-8605-ae8cd7c99b10';
const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
function status(el,msg,type=''){el.textContent=msg;el.className='status show '+type}function clear(el){el.textContent='';el.className='status'}
function showLogin(){ $('loginBox').classList.remove('hidden');$('adminBox').classList.add('hidden');$('logout').classList.add('hidden') }function showAdmin(){ $('loginBox').classList.add('hidden');$('adminBox').classList.remove('hidden');$('logout').classList.remove('hidden') }
async function boot(){const {data}=await sb.auth.getSession();if(!data.session)return showLogin();if(data.session.user.id!==ADMIN){await sb.auth.signOut();return showLogin()}showAdmin();loadGallery()}
$('login').onclick=async()=>{clear($('loginStatus'));const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return status($('loginStatus'),'Email dan password wajib diisi.','err');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return status($('loginStatus'),'Login gagal: '+error.message,'err');if(!data.user||data.user.id!==ADMIN){await sb.auth.signOut();return status($('loginStatus'),'Akun ini bukan admin yang diizinkan.','err')}showAdmin();loadGallery()};
$('logout').onclick=async()=>{await sb.auth.signOut();showLogin()};$('reset').onclick=()=>{$('judul').value='';$('kategori').value='';$('deskripsi').value='';$('foto').value='';clear($('uploadStatus'))};
function safeName(name){const ext=name.includes('.')?'.'+name.split('.').pop().toLowerCase():'';const base=name.replace(/\.[^/.]+$/,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,45)||'foto';return Date.now()+'-'+base+ext}
$('upload').onclick=async()=>{clear($('uploadStatus'));const judul=$('judul').value.trim(),kategori=$('kategori').value.trim(),deskripsi=$('deskripsi').value.trim(),file=$('foto').files[0];if(!judul||!file)return status($('uploadStatus'),'Judul dan foto wajib diisi.','err');if(file.size>10*1024*1024)return status($('uploadStatus'),'Ukuran foto melebihi 10 MB.','err');const nama=safeName(file.name);$('upload').disabled=true;$('upload').textContent='Mengupload...';const {error:upErr}=await sb.storage.from('galery').upload(nama,file,{cacheControl:'3600',upsert:false,contentType:file.type});if(upErr){$('upload').disabled=false;$('upload').textContent='Upload & Simpan';return status($('uploadStatus'),'Upload gagal: '+upErr.message,'err')}const {data:pub}=sb.storage.from('galery').getPublicUrl(nama);const {error:dbErr}=await sb.from('galery').insert({judul,deskripsi,kategori,url_foto:pub.publicUrl,nama_file:nama});if(dbErr){await sb.storage.from('galery').remove([nama]);$('upload').disabled=false;$('upload').textContent='Upload & Simpan';return status($('uploadStatus'),'Data gagal disimpan: '+dbErr.message,'err')}$('upload').disabled=false;$('upload').textContent='Upload & Simpan';$('judul').value='';$('kategori').value='';$('deskripsi').value='';$('foto').value='';status($('uploadStatus'),'Foto berhasil diupload.','ok');loadGallery()};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
async function loadGallery(){$('gallery').innerHTML='';const {data,error}=await sb.from('galery').select('*').order('created_at',{ascending:false});if(error){$('empty').textContent='Gagal membaca galeri: '+error.message;$('empty').classList.remove('hidden');return}if(!data||!data.length){$('empty').textContent='Belum ada data galeri.';$('empty').classList.remove('hidden');return}$('empty').classList.add('hidden');data.forEach(item=>{const el=document.createElement('article');el.className='item';el.innerHTML=`<img src="${esc(item.url_foto||'')}" alt="${esc(item.judul||'Foto')}"><div class="body">${item.kategori?`<span class="badge">${esc(item.kategori)}</span>`:''}<h3>${esc(item.judul||'Tanpa judul')}</h3><div class="desc">${esc(item.deskripsi||'')}</div><div class="item-actions"><button class="secondary edit">Edit</button><button class="danger del">Hapus</button></div></div>`;el.querySelector('.edit').onclick=()=>openEdit(item);el.querySelector('.del').onclick=()=>removeItem(item);$('gallery').appendChild(el)})}
function openEdit(item){$('editId').value=item.id;$('editJudul').value=item.judul||'';$('editKategori').value=item.kategori||'';$('editDeskripsi').value=item.deskripsi||'';clear($('editStatus'));$('editDialog').showModal()}
$('cancelEdit').onclick=()=>$('editDialog').close();$('saveEdit').onclick=async()=>{const id=$('editId').value,judul=$('editJudul').value.trim(),kategori=$('editKategori').value.trim(),deskripsi=$('editDeskripsi').value.trim();if(!judul)return status($('editStatus'),'Judul tidak boleh kosong.','err');const {error}=await sb.from('galery').update({judul,kategori,deskripsi}).eq('id',id);if(error)return status($('editStatus'),'Gagal menyimpan: '+error.message,'err');status($('editStatus'),'Perubahan berhasil disimpan.','ok');loadGallery();setTimeout(()=>$('editDialog').close(),500)};
async function removeItem(item){if(!confirm('Hapus "'+(item.judul||'foto ini')+'"?'))return;if(item.nama_file){const {error}=await sb.storage.from('galery').remove([item.nama_file]);if(error)return alert('File gagal dihapus: '+error.message)}const {error}=await sb.from('galery').delete().eq('id',item.id);if(error)return alert('Data gagal dihapus: '+error.message);loadGallery()}
$('refresh').onclick=loadGallery;sb.auth.onAuthStateChange((_e,s)=>{if(!s)showLogin()});boot();
</script>
</body></html>
