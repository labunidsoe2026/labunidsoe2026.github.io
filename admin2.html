<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin 2 | Laboratorium Terpadu</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7f6;color:#1f2937}
header{background:#0b5d4b;color:white;padding:22px 28px}
header h1{margin:0;font-size:26px}
header p{margin:5px 0 0}
.wrap{max-width:760px;margin:45px auto;padding:0 18px}
.card{background:white;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
label{display:block;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:13px;border:1px solid #cfd6d3;border-radius:10px;font-size:16px;box-sizing:border-box}
button{margin-top:18px;border:0;border-radius:10px;background:#0b5d4b;color:white;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55}
.status{margin-top:16px;padding:12px;border-radius:10px;background:#eef2f1}
.ok{background:#ecfdf3;color:#027a48}
.err{background:#fef3f2;color:#b42318}
.hidden{display:none}
.admin{margin-top:20px;background:#ecfdf3;padding:18px;border-radius:12px}
</style>
</head>
<body>

<header>
  <h1>Admin Laboratorium Terpadu</h1>
  <p>Universitas Dr. Soekardjo Banyuwangi</p>
</header>

<div class="wrap">
  <div class="card">
    <h2>Login Admin</h2>

    <div id="jsStatus" class="status">Memeriksa JavaScript...</div>

    <label>Email</label>
    <input id="email" type="email" autocomplete="username">

    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password">

    <button id="loginBtn" type="button" onclick="doLogin()">Login</button>

    <div id="loginStatus" class="status hidden"></div>

    <div id="adminArea" class="admin hidden">
      <strong>Login berhasil ✅</strong>
      <p>Akun admin Supabase berhasil terhubung.</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://plottbyxuuqzlppytkqj.supabase.co";
const API_KEY = "sb_publishable_rI0z0kyaLhMP3x4_lhL79w_M5oHEGWB";
const ADMIN_UID = "5a12f804-2471-47d5-8605-ae8cd7c99b10";

document.getElementById("jsStatus").textContent = "JavaScript aktif ✅";
document.getElementById("jsStatus").className = "status ok";

function showMessage(message, isError) {
  const el = document.getElementById("loginStatus");
  el.textContent = message;
  el.className = "status " + (isError ? "err" : "ok");
}

async function doLogin() {
  const btn = document.getElementById("loginBtn");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  showMessage("Tombol Login sudah terbaca. Menghubungi Supabase...", false);

  if (!email || !password) {
    showMessage("Email dan password wajib diisi.", true);
    return;
  }

  btn.disabled = true;
  btn.textContent = "Memproses...";

  try {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/token?grant_type=password",
      {
        method: "POST",
        headers: {
          "apikey": API_KEY,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const raw = await response.text();

    let data = {};
    try {
      data = JSON.parse(raw);
    } catch (_) {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        raw ||
        "Login gagal"
      );
    }

    if (!data.user) {
      throw new Error("Supabase tidak mengembalikan data pengguna.");
    }

    if (data.user.id !== ADMIN_UID) {
      throw new Error("Login berhasil, tetapi akun ini bukan admin yang diizinkan.");
    }

    sessionStorage.setItem("lab_access_token", data.access_token || "");
    sessionStorage.setItem("lab_user_id", data.user.id);

    showMessage("Login berhasil ✅", false);
    document.getElementById("adminArea").classList.remove("hidden");

  } catch (err) {
    showMessage("Error: " + err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = "Login";
  }
}

document.getElementById("password").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doLogin();
});
</script>

</body>
</html>
